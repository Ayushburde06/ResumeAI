<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered resume tailoring — match your resume to any job description in seconds." />
    <title>ResumeAI — Tailor Your Resume with AI</title>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" role="status" aria-live="polite" aria-label="Loading ResumeAI">
        <div class="initial-loader__mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="initial-loader__brand">ResumeAI</div>
        <div class="initial-loader__text">Preparing your workspace</div>
      </div>
    </div>
    <style>
      .initial-loader {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        color: #1a1f2e;
        background:
          radial-gradient(circle at 20% 0%, rgba(26, 31, 46, .08), transparent 34%),
          linear-gradient(180deg, #fbfaf7 0%, #f2f4f7 100%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .initial-loader__mark { display: flex; align-items: flex-end; gap: 5px; height: 34px; }
      .initial-loader__mark span {
        display: block;
        width: 7px;
        height: 16px;
        border-radius: 999px;
        background: #1a1f2e;
        animation: resume-loader 1s ease-in-out infinite;
      }
      .initial-loader__mark span:nth-child(2) { height: 26px; animation-delay: .12s; }
      .initial-loader__mark span:nth-child(3) { height: 20px; animation-delay: .24s; }
      .initial-loader__brand { font-size: 18px; font-weight: 700; letter-spacing: -.03em; }
      .initial-loader__text { color: #71717a; font-size: 12px; }
      @keyframes resume-loader {
        0%, 100% { transform: scaleY(.65); opacity: .45; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader__mark span { animation: none; opacity: .75; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
